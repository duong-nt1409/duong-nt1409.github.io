<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
    <title>✨ DNG's Photobooth — Cloud Album</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body {
            background: #0b0e21;
            color: #f1f4ff;
            font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 🌟 LUXURY DARK LOADER (KHÔNG BAO GIỜ BỊ MÀN TRẮNG) */
        #luxuryLoader {
            position: fixed;
            inset: 0;
            z-index: 999999;
            background: #0b0e21;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #luxuryLoader.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .loader-glow-icon {
            font-size: 3.2rem;
            margin-bottom: 16px;
            animation: pulseGlow 1.6s ease-in-out infinite alternate;
        }
        @keyframes pulseGlow {
            0% { transform: scale(0.92); filter: drop-shadow(0 0 10px rgba(255,93,162,0.5)); }
            100% { transform: scale(1.08); filter: drop-shadow(0 0 25px rgba(168,85,247,0.9)); }
        }
        .loader-brand-title {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ff5da2, #a855f7, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .loader-subtitle {
            font-size: 0.88rem;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 24px;
        }
        .loader-bar-wrap {
            width: 180px;
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }
        .loader-bar-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 45%;
            background: linear-gradient(90deg, #ff5da2, #06b6d4);
            border-radius: 999px;
            animation: barSlide 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes barSlide {
            0% { left: -45%; width: 30%; }
            50% { width: 60%; }
            100% { left: 100%; width: 40%; }
        }

        /* KHÔNG CÓ PARAMETER (TRANG CHỦ DEFAULT) */
        #defaultHomeView {
            display: none;
            max-width: 460px;
            margin: 60px auto;
            padding: 32px 24px;
            text-align: center;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* KHUNG CHỨA NỘI DUNG ALBUM */
        #albumContainer {
            width: 100%;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <!-- LOADER NỀN TỐI SANG TRỌNG -->
    <div id="luxuryLoader">
        <div class="loader-glow-icon">✨</div>
        <div class="loader-brand-title">DNG'S PHOTOBOOTH</div>
        <div class="loader-subtitle" id="loaderStatusText">Đang mở không gian kỷ niệm của bạn...</div>
        <div class="loader-bar-wrap">
            <div class="loader-bar-fill"></div>
        </div>
    </div>

    <!-- NỘI DUNG ALBUM INJECT TRỰC TIẾP TỪ CLOUDFLARE R2 -->
    <div id="albumContainer"></div>

    <!-- MÀN HÌNH NẾU KHÔNG CÓ SESSION ID -->
    <div id="defaultHomeView">
        <div style="font-size: 3.5rem; margin-bottom: 16px;">📸</div>
        <h2 style="font-size: 1.4rem; font-weight: 800; color: #ff5da2; margin-bottom: 12px;">Cổng Album Trực Tuyến DNG's Photobooth</h2>
        <p style="font-size: 0.9rem; color: #94a3b8; line-height: 1.6; margin-bottom: 20px;">
            Chào mừng bạn đến với hệ thống lưu trữ ảnh & video kỷ niệm Cloud.<br>
            Vui lòng quét <b>mã QR trên bản in ảnh</b> để mở album riêng của bạn nhé!
        </p>
        <div style="font-size: 0.8rem; color: #64748b; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.08);">
            🔒 Dữ liệu được bảo mật qua Cloudflare R2 Edge
        </div>
    </div>

    <script>
        (async function() {
            const R2_BASE = 'https://pub-07475ec2becf49398687a8d39e9120af.r2.dev';
            const loader = document.getElementById('luxuryLoader');
            const statusText = document.getElementById('loaderStatusText');
            const container = document.getElementById('albumContainer');
            const homeView = document.getElementById('defaultHomeView');

            const urlParams = new URLSearchParams(window.location.search);
            let sessionId = urlParams.get('p') || urlParams.get('s') || urlParams.get('session');
            let customTargetUrl = urlParams.get('url');

            if (!sessionId && window.location.hash) {
                const hashVal = window.location.hash.replace(/^#/, '').trim();
                if (hashVal) sessionId = hashVal;
            }

            if (!sessionId && !customTargetUrl) {
                if (loader) loader.classList.add('fade-out');
                if (homeView) homeView.style.display = 'block';
                return;
            }

            let targetHtmlUrl = customTargetUrl;
            let baseUrl = '';

            if (sessionId) {
                sessionId = sessionId.replace(/\/index\.html$/i, '').trim();
                targetHtmlUrl = `${R2_BASE}/p/${sessionId}/index.html`;
                baseUrl = `${R2_BASE}/p/${sessionId}/`;
            } else if (customTargetUrl) {
                const lastSlash = customTargetUrl.lastIndexOf('/');
                baseUrl = (lastSlash !== -1) ? customTargetUrl.substring(0, lastSlash + 1) : '';
            }

            try {
                const res = await fetch(targetHtmlUrl, {
                    cache: 'no-cache',
                    headers: { 'Accept': 'text/html' }
                });

                if (!res.ok) {
                    throw new Error('HTTP ' + res.status);
                }

                const rawHtml = await res.text();

                // 2. Chèn thẻ <base> vào document.head thật
                let baseEl = document.querySelector('base');
                if (!baseEl) {
                    baseEl = document.createElement('base');
                    document.head.insertBefore(baseEl, document.head.firstChild);
                }
                baseEl.href = baseUrl;

                // 3. Chuẩn hóa tất cả đường dẫn tương đối thành tuyệt đối R2
                function toAbsoluteUrl(url) {
                    if (!url) return url;
                    url = url.trim();
                    if (url.startsWith('http://') || url.startsWith('https://') || url.startsWith('//') || url.startsWith('data:') || url.startsWith('#') || url.startsWith('javascript:')) {
                        return url;
                    }
                    if (url.startsWith('./')) {
                        url = url.substring(2);
                    }
                    return baseUrl + url;
                }

                const parser = new DOMParser();
                const doc = parser.parseFromString(rawHtml, 'text/html');

                // Chuẩn hóa ảnh (img)
                doc.querySelectorAll('img').forEach(el => {
                    const src = el.getAttribute('src');
                    if (src) el.setAttribute('src', toAbsoluteUrl(src));
                    const dsrc = el.getAttribute('data-src');
                    if (dsrc) el.setAttribute('data-src', toAbsoluteUrl(dsrc));
                });

                // Chuẩn hóa video & source
                doc.querySelectorAll('video').forEach(el => {
                    const src = el.getAttribute('src');
                    if (src) el.setAttribute('src', toAbsoluteUrl(src));
                    const poster = el.getAttribute('poster');
                    if (poster) el.setAttribute('poster', toAbsoluteUrl(poster));
                    el.setAttribute('playsinline', '');
                    el.setAttribute('webkit-playsinline', '');
                    el.muted = true;
                });

                doc.querySelectorAll('source').forEach(el => {
                    const src = el.getAttribute('src');
                    if (src) el.setAttribute('src', toAbsoluteUrl(src));
                });

                // Chuẩn hóa nút tải về (a)
                doc.querySelectorAll('a').forEach(el => {
                    const href = el.getAttribute('href');
                    if (href) el.setAttribute('href', toAbsoluteUrl(href));
                    const fb = el.getAttribute('data-fallback-href');
                    if (fb) el.setAttribute('data-fallback-href', toAbsoluteUrl(fb));
                });

                // Chuẩn hóa các hàm onclick inline có chứa tên file tương đối
                doc.querySelectorAll('[onclick]').forEach(el => {
                    let oc = el.getAttribute('onclick');
                    if (oc && (oc.includes('.mp4') || oc.includes('.jpg') || oc.includes('.jpeg') || oc.includes('.png') || oc.includes('.webm'))) {
                        oc = oc.replace(/'([^':]+?\.(?:jpg|jpeg|png|mp4|webm))'/g, function(match, filename) {
                            return "'" + toAbsoluteUrl(filename) + "'";
                        });
                        el.setAttribute('onclick', oc);
                    }
                });

                // 4. Inject CSS và meta từ head
                doc.head.querySelectorAll('style, link[rel="stylesheet"]').forEach(el => {
                    document.head.appendChild(el.cloneNode(true));
                });

                if (doc.title) {
                    document.title = doc.title;
                }

                // 5. Đưa nội dung body vào container
                container.innerHTML = doc.body.innerHTML;

                // 6. Hook DOMContentLoaded và load listener để chạy ngay lập tức khi inject
                const _origDocAddEventListener = document.addEventListener.bind(document);
                document.addEventListener = function(type, listener, options) {
                    if (type === 'DOMContentLoaded') {
                        if (document.readyState === 'complete' || document.readyState === 'interactive') {
                            setTimeout(listener, 10);
                            return;
                        }
                    }
                    return _origDocAddEventListener(type, listener, options);
                };

                const _origWinAddEventListener = window.addEventListener.bind(window);
                window.addEventListener = function(type, listener, options) {
                    if (type === 'load' && document.readyState === 'complete') {
                        setTimeout(listener, 10);
                        return;
                    }
                    return _origWinAddEventListener(type, listener, options);
                };

                // 7. Kích hoạt và thực thi các thẻ <script> bên trong
                const scripts = Array.from(doc.querySelectorAll('script'));
                for (const oldScript of scripts) {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.textContent = oldScript.textContent;
                    document.body.appendChild(newScript);
                }

                document.dispatchEvent(new Event('DOMContentLoaded'));

                // 8. Đảm bảo số lượng file tải về và hàm kiểm tra hạn hoạt động chuẩn xác
                setTimeout(() => {
                    const count = document.querySelectorAll('.btn-dl-item').length;
                    const el = document.getElementById('totalDlCount');
                    if (el && count > 0) el.textContent = count;

                    if (typeof window.checkAlbumExpiry === 'function') {
                        window.checkAlbumExpiry();
                    }

                    document.querySelectorAll('video').forEach(vid => {
                        vid.muted = true;
                        vid.playsInline = true;
                        vid.classList.add('loaded');
                        const p = vid.play();
                        if (p && typeof p.catch === 'function') {
                            p.catch(() => {});
                        }
                    });

                    document.querySelectorAll('img').forEach(img => {
                        img.classList.add('loaded');
                    });
                }, 60);

                // 9. Mượt mà ẩn loader và giải phóng tài nguyên
                setTimeout(() => {
                    if (loader) {
                        loader.classList.add('fade-out');
                        setTimeout(() => {
                            if (loader.parentNode) loader.parentNode.removeChild(loader);
                        }, 500);
                    }
                }, 250);

            } catch (err) {
                console.error('[Viewer Error]:', err);
                if (statusText) statusText.innerHTML = '⚠️ Không thể tải album hoặc phiên chụp đã đóng.<br><small style="opacity:0.7;">Vui lòng kiểm tra lại kết nối mạng của bạn.</small>';
                setTimeout(() => {
                    window.location.replace(targetHtmlUrl);
                }, 1200);
            }
        })();
    </script>
</body>
</html>
